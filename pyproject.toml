[project]
name = "cyberguard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.163.0",
    "joblib>=1.6.0",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pydantic>=2.14.3",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.1.8",
    "streamlit>=1.67.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
